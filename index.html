<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vitun iso mörkö">
  <title>Vitun iso mörkö</title>
  <style>
    :root {
      --bg: #070a12;
      --card-bg: #121a2d;
      --accent: #38bdf8;
      --accent-purple: #c084fc;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --done: #22c55e;
      --border: #1e2c47;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 12px 12px 110px 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header { text-align: center; padding: 6px 0 14px 0; }
    .main-title {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(192,132,252,0.15));
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform 0.1s ease;
    }
    .main-title:active { transform: scale(0.96); }

    /* Mode selector */
    .mode-container {
      display: flex;
      background: #060911;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1;
      min-width: 62px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 9px 4px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #070a12;
      border-color: var(--accent);
    }
    .tab-btn.history-tab {
      background: #1e1b4b;
      color: #c7d2fe;
      border-color: #3730a3;
    }
    .tab-btn.history-tab.active {
      background: #818cf8;
      color: #070a12;
    }

    /* Exercise cards */
    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .exercise-title {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-tag {
      font-size: 0.72rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* Equipment variant buttons */
    .variant-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .variant-btn {
      background: #070a12;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }
    .variant-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Target badge & Progressive Overload alert */
    .target-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      margin-bottom: 10px;
      padding: 4px 8px;
      background: #070a12;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .target-text { color: var(--accent); font-weight: 600; }
    .overload-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .overload-ready { background: rgba(34, 197, 94, 0.2); color: var(--done); border: 1px solid var(--done); }
    .overload-wait { color: var(--text-dim); }

    /* Set rows */
    .set-row {
      display: grid;
      grid-template-columns: 28px 1fr 1fr;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .set-label { color: var(--text-dim); font-size: 0.8rem; font-weight: 700; }
    .stepper {
      display: flex;
      align-items: center;
      background: #070a12;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .step-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 1.15rem;
      font-weight: bold;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-value {
      flex: 1;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }

    /* Single Progress Action Button */
    .set-action-btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border-radius: 8px;
      border: none;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #1e293b;
      color: var(--accent);
      border: 1px solid var(--accent);
      transition: background 0.15s ease;
    }
    .set-action-btn.active-step { background: var(--accent); color: #070a12; }
    .set-action-btn.finished-step { background: var(--done); color: #070a12; border-color: var(--done); }

    /* Flash screen notification when silent */
    .flash-alert {
      position: fixed;
      inset: 0;
      background: rgba(56, 189, 248, 0.95);
      color: #070a12;
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .flash-alert.active {
      opacity: 1;
      pointer-events: auto;
      animation: pulseScreen 1s infinite alternate;
    }
    @keyframes pulseScreen {
      from { background: rgba(56, 189, 248, 0.95); }
      to { background: rgba(34, 197, 94, 0.95); }
    }
    .flash-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; }
    .flash-sub { font-size: 1.1rem; font-weight: 700; margin-bottom: 24px; }
    .btn-dismiss-flash {
      background: #070a12;
      color: #fff;
      border: none;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 14px 28px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: #121a2d;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-title { font-size: 1.15rem; font-weight: 800; color: var(--accent); margin: 0; }
    .modal-close {
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }
    .motion-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .motion-box { background: #070a12; border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
    .motion-tag { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
    .motion-tag.start { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .motion-tag.end { background: rgba(34, 197, 94, 0.2); color: var(--done); }
    .motion-desc { font-size: 0.78rem; color: var(--text); line-height: 1.35; font-weight: 600; }
    .modal-target { font-size: 0.82rem; font-weight: 700; color: #e2e8f0; margin-bottom: 8px; }
    .modal-tips { margin: 0 0 14px 0; padding-left: 18px; font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; }
    .btn-quick-video {
      display: block;
      width: 100%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
    }

    /* Mörkö Easter Egg */
    .morko-card { background: #0d0b1a; border: 2px solid var(--accent-purple); text-align: center; padding: 20px 16px; }
    .morko-real-img { width: 100%; max-width: 270px; height: auto; border-radius: 12px; border: 2px solid var(--accent-purple); display: block; margin: 0 auto 12px auto; }
    .morko-quote { font-size: 1.25rem; font-weight: 900; color: var(--accent-purple); text-transform: uppercase; margin-bottom: 6px; }

    /* Action buttons */
    .footer-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
    .btn-save-workout { background: var(--done); border: none; color: #070a12; font-weight: 700; padding: 12px; border-radius: 10px; font-size: 0.9rem; cursor: pointer; }
    .btn-reset { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 8px 16px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; }

    /* Timer bar */
    .timer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0284c7;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 0.95rem;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      z-index: 100;
    }
    .timer-bar.show { transform: translateY(0); }
    .timer-btn { background: rgba(0,0,0,0.25); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 4px; }
    .history-entry { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .history-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; color: var(--accent); }
    .history-item { font-size: 0.82rem; padding: 3px 0; display: flex; justify-content: space-between; color: var(--text); }
  </style>
</head>
<body>

  <header>
    <div class="main-title" onclick="openMorkoModal()">VITUN ISO MÖRKÖ</div>
  </header>

  <div class="mode-container">
    <button id="mode-5" class="mode-btn active" onclick="setProgramMode('5day')">5 pv / vko (PPL-UL)</button>
    <button id="mode-3" class="mode-btn" onclick="setProgramMode('3day')">3 pv / vko (Koko keho)</button>
  </div>

  <div id="tabs-container" class="tabs"></div>

  <div id="main-content"></div>

  <!-- Screen Flash Alert for Silent Mode -->
  <div id="flash-alert" class="flash-alert">
    <div class="flash-title">⏱️ TAUON AIKA TÄYNNÄ!</div>
    <div class="flash-sub">Kylmä rauta kutsuu. Seuraava sarja käyntiin!</div>
    <button class="btn-dismiss-flash" onclick="dismissFlash()">Kuittaa & Aloita sarja</button>
  </div>

  <!-- Movement Guide Modal -->
  <div id="guide-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Liikkeen nimi</h3>
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
      </div>
      <div class="motion-grid">
        <div class="motion-box">
          <span class="motion-tag start">1. Lähtö / Venytys</span>
          <div id="modal-step1" class="motion-desc"></div>
        </div>
        <div class="motion-box">
          <span class="motion-tag end">2. Loppu / Supistus</span>
          <div id="modal-step2" class="motion-desc"></div>
        </div>
      </div>
      <div id="modal-target" class="modal-target"></div>
      <ul id="modal-tips" class="modal-tips"></ul>
      <a id="modal-video-btn" class="btn-quick-video" href="#" target="_blank" rel="noopener">▶️ Katso 15s tekniikkavideo YouTubesta</a>
    </div>
  </div>

  <!-- Mörkö Modal -->
  <div id="morko-modal" class="modal-overlay" onclick="closeMorkoModal(event)">
    <div class="modal-card morko-card" onclick="event.stopPropagation()">
      <img 
        src="morko.png" 
        onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/fi/thumb/b/be/Morko_muumilaaksosta.png/400px-Morko_muumilaaksosta.png'" 
        alt="Mörkö" 
        class="morko-real-img"
      />
      <div class="morko-quote">VITUN ISO MÖRKÖ</div>
      <div style="color:var(--text-dim); font-size:0.82rem; margin-bottom:14px;">"Gym08:n kylmintä rautaa ja hemo hauikset."</div>
      <button class="btn-save-workout" onclick="closeMorkoModalDirect()">Sulje & Jatka treeniä</button>
    </div>
  </div>

  <div id="timer" class="timer-bar">
    <span id="timer-text">Lepo: 2:00</span>
    <div>
      <button class="timer-btn" onclick="addTimer(30)">+30s</button>
      <button class="timer-btn" onclick="stopTimer()">Sulje</button>
    </div>
  </div>

    // Screen Wake Lock API (keeps screen on during workout)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function initNotifications() {
      requestWakeLock();
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }
    }

    function setProgramMode(mode) {
      currentMode = mode;
      localStorage.setItem("prog_mode", mode);
      document.getElementById("mode-5").classList.toggle("active", mode === "5day");
      document.getElementById("mode-3").classList.toggle("active", mode === "3day");
      currentTab = 0;
      renderTabs();
      renderContent();
    }

    function renderTabs() {
      const container = document.getElementById("tabs-container");
      const list = programData[currentMode];
      let html = "";
      list.forEach((w, idx) => {
        const shortName = w.name.split(" ")[0];
        html += `<button class="tab-btn ${currentTab === idx ? 'active' : ''}" onclick="switchTab(${idx})">${shortName}</button>`;
      });
      html += `<button class="tab-btn history-tab ${currentTab === 'history' ? 'active' : ''}" onclick="switchTab('history')">📜 Historia</button>`;
      container.innerHTML = html;
    }

    function switchTab(tab) {
      currentTab = tab;
      renderTabs();
      renderContent();
    }

    // Storage Key Helpers
    function getSelectedVariant(eIdx) {
      return localStorage.getItem(`var_sel_${currentMode}_${currentTab}_${eIdx}`) || 0;
    }
    function setSelectedVariant(eIdx, vIdx) {
      localStorage.setItem(`var_sel_${currentMode}_${currentTab}_${eIdx}`, vIdx);
      renderContent();
    }

    function getWeightKey(eIdx, vId, sIdx) {
      return `val_w_${currentMode}_${currentTab}_${eIdx}_${vId}_s${sIdx}`;
    }
    function getRepsKey(eIdx, sIdx) {
      return `val_r_${currentMode}_${currentTab}_${eIdx}_s${sIdx}`;
    }
    function getProgStepKey(eIdx) {
      return `prog_step_${currentMode}_${currentTab}_${eIdx}`;
    }

    function renderContent() {
      const main = document.getElementById("main-content");
      if (currentTab === "history") {
        renderHistory(main);
        return;
      }

      const workout = programData[currentMode][currentTab];
      const totalExercises = workout.exercises.length;
      let html = `<div style="font-size:0.9rem; font-weight:700; color:var(--text-dim); margin-bottom:8px;">${workout.name}</div>`;

      workout.exercises.forEach((ex, eIdx) => {
        const selectedVIdx = parseInt(getSelectedVariant(eIdx)) || 0;
        const currentVariant = ex.variants[selectedVIdx] || ex.variants[0];
        const stepStatus = parseInt(localStorage.getItem(getProgStepKey(eIdx)) || "0"); // 0 = 0/3, 1 = 1/3, 2 = 2/3, 3 = 3/3 done

        // Determine if Double Progression target is achieved
        let allHitTarget = true;
        for (let s = 0; s < 3; s++) {
          const rKey = getRepsKey(eIdx, s);
          const currentReps = localStorage.getItem(rKey) !== null ? parseInt(localStorage.getItem(rKey)) : ex.targetMin;
          if (currentReps < ex.targetMax) allHitTarget = false;
        }

        html += `
          <div class="exercise-card">
            <div class="exercise-header">
              <div class="exercise-title" onclick="openExerciseGuide('${ex.name}')">
                <span>${ex.name}</span>
                <span class="info-tag">Ohje ℹ️</span>
              </div>
            </div>

            <!-- Equipment Variants Selector -->
            ${ex.variants.length > 1 ? `
              <div class="variant-selector">
                ${ex.variants.map((v, vIdx) => `
                  <button class="variant-btn ${vIdx === selectedVIdx ? 'active' : ''}" onclick="setSelectedVariant(${eIdx}, ${vIdx})">
                    ${v.name}
                  </button>
                `).join("")}
              </div>
            ` : ''}

            <!-- Target & Progression Badge -->
            <div class="target-bar">
              <span class="target-text">Tavoite: 3 × ${ex.targetMin}–${ex.targetMax} toistoa</span>
              <span class="overload-badge ${allHitTarget ? 'overload-ready' : 'overload-wait'}">
                ${allHitTarget ? '🔥 Tavoite täynnä! (+2.5 kg)' : `Jatka kunnes 3 × ${ex.targetMax}`}
              </span>
            </div>
        `;

        // 3 Sets Rows
        for (let s = 0; s < 3; s++) {
          const wKey = getWeightKey(eIdx, currentVariant.id, s);
          const rKey = getRepsKey(eIdx, s);

          // Fallback to legacy keys if exists
          const legacyWeight = localStorage.getItem(`tp_${currentMode}_w${currentTab}_e${eIdx}_s${s}_w`);
          const savedW = localStorage.getItem(wKey) !== null ? parseFloat(localStorage.getItem(wKey)) : (legacyWeight ? parseFloat(legacyWeight) : currentVariant.defaultWeight);
          const savedR = localStorage.getItem(rKey) !== null ? parseInt(localStorage.getItem(rKey)) : ex.targetMin;
          const unit = currentVariant.isLevel ? "taso" : "kg";

          html += `
            <div class="set-row">
              <span class="set-label">S${s + 1}</span>
              <div class="stepper">
                <button class="step-btn" onclick="changeVal(${eIdx}, '${currentVariant.id}', ${s}, 'w', -${currentVariant.step})">-</button>
                <span class="step-value" id="val_w_${eIdx}_${s}">${savedW} ${unit}</span>
                <button class="step-btn" onclick="changeVal(${eIdx}, '${currentVariant.id}', ${s}, 'w', ${currentVariant.step})">+</button>
              </div>
              <div class="stepper">
                <button class="step-btn" onclick="changeVal(${eIdx}, '${currentVariant.id}', ${s}, 'r', -1)">-</button>
                <span class="step-value" id="val_r_${eIdx}_${s}">${savedR} toistoa</span>
                <button class="step-btn" onclick="changeVal(${eIdx}, '${currentVariant.id}', ${s}, 'r', 1)">+</button>
              </div>
            </div>
          `;
        }

        // Single Sequential Set Action Button (1/3 -> 2/3 -> 3/3 / Finish)
        const isLastExercise = (eIdx === totalExercises - 1);
        let buttonText = "Kuittaa sarja 1/3 ▶ (Aloita tauko)";
        let buttonClass = "";

        if (stepStatus === 1) {
          buttonText = "Kuittaa sarja 2/3 ▶ (Aloita tauko)";
          buttonClass = "active-step";
        } else if (stepStatus === 2) {
          buttonText = isLastExercise ? "Päätä treeni & Tallenna 🏆" : "Kuittaa sarja 3/3 ✓ (Valmis!)";
          buttonClass = "active-step";
        } else if (stepStatus >= 3) {
          buttonText = isLastExercise ? "Treeni valmis! 🏆 (Nollaa)" : "Liike suoritettu (3/3) ✓ (Nollaa)";
          buttonClass = "finished-step";
        }

        html += `
          <button class="set-action-btn ${buttonClass}" onclick="handleSetProgress(${eIdx}, ${ex.rest}, ${isLastExercise})">
            ${buttonText}
          </button>
        </div>`;
      });

      html += `
        <div class="footer-actions">
          <button class="btn-save-workout" onclick="saveCurrentToHistory()">💾 Tallenna treeni historiaan</button>
          <button class="btn-reset" onclick="resetCurrentWorkout()">Nollaa tämän päivän sarjamerkinnät</button>
        </div>
      `;

      main.innerHTML = html;
    }

    function changeVal(eIdx, vId, sIdx, type, delta) {
      const ex = programData[currentMode][currentTab].exercises[eIdx];
      const key = type === 'w' ? getWeightKey(eIdx, vId, sIdx) : getRepsKey(eIdx, sIdx);
      let val = localStorage.getItem(key) !== null ? parseFloat(localStorage.getItem(key)) : (type === 'w' ? ex.variants.find(v => v.id === vId).defaultWeight : ex.targetMin);

      val = Math.max(0, val + delta);
      val = Math.round(val * 10) / 10;
      localStorage.setItem(key, val);

      renderContent();
    }

    // --- SEQUENTIAL 1/3, 2/3, 3/3 HANDLER ---
    function handleSetProgress(eIdx, restSeconds, isLastExercise) {
      initNotifications();
      const stepKey = getProgStepKey(eIdx);
      let currentStep = parseInt(localStorage.getItem(stepKey) || "0");

      if (currentStep === 0) {
        // Set 1 complete -> Start rest timer
        localStorage.setItem(stepKey, "1");
        startTimer(restSeconds);
      } else if (currentStep === 1) {
        // Set 2 complete -> Start rest timer
        localStorage.setItem(stepKey, "2");
        startTimer(restSeconds);
      } else if (currentStep === 2) {
        // Set 3 complete -> DO NOT START TIMER! Finish exercise or workout
        localStorage.setItem(stepKey, "3");
        stopTimer();
        if (isLastExercise) {
          saveCurrentToHistory();
          alert("Upea treeni takana! Kaikki liikkeet suoritettu ja treeni tallennettu historiaan. 🔥");
        }
      } else {
        // Reset this exercise if clicked when already finished
        localStorage.setItem(stepKey, "0");
      }

      renderContent();
    }

    // --- SOUND & SILENT-MODE SCREEN FLASH ALERT ---
    function triggerSilentAlarm() {
      // 1. Strong Vibration Pattern
      if ("vibrate" in navigator) {
        navigator.vibrate([600, 200, 600, 200, 1000]);
      }

      // 2. Audible Beep (works if sound is on)
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.0);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 1.0);
      } catch (e) {}

      // 3. Flashing visual overlay on screen (critical for silent mode!)
      document.getElementById("flash-alert").classList.add("active");

      // 4. Push notification
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("Palautusaika päättyi! ⏱️", {
          body: "Aika aloittaa seuraava sarja!",
          requireInteraction: true,
          vibrate: [600, 200, 600, 200, 1000]
        });
      }
    }

    function dismissFlash() {
      document.getElementById("flash-alert").classList.remove("active");
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      targetTimerEnd = Date.now() + seconds * 1000;
      document.getElementById("timer").classList.add("show");
      updateTimerUI();

      timerInterval = setInterval(() => {
        const remaining = Math.round((targetTimerEnd - Date.now()) / 1000);
        if (remaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById("timer-text").innerText = "Aika täynnä!";
          triggerSilentAlarm();
        } else {
          updateTimerUI();
        }
      }, 500);
    }

    function updateTimerUI() {
      const remaining = Math.max(0, Math.round((targetTimerEnd - Date.now()) / 1000));
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      document.getElementById("timer-text").innerText = `Lepo: ${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function addTimer(sec) {
      if (targetTimerEnd) {
        targetTimerEnd += sec * 1000;
        updateTimerUI();
      }
    }

    function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById("timer").classList.remove("show");
    }

    // --- HISTORY SYSTEM ---
    function saveCurrentToHistory() {
      const workout = programData[currentMode][currentTab];
      const dateStr = new Date().toLocaleDateString("fi-FI", { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

      };

      workout.exercises.forEach((ex, eIdx) => {
        const selectedVIdx = parseInt(getSelectedVariant(eIdx)) || 0;
        const currentVariant = ex.variants[selectedVIdx] || ex.variants[0];
        const setsData = [];

        for (let s = 0; s < 3; s++) {
          const wKey = getWeightKey(eIdx, currentVariant.id, s);
          const rKey = getRepsKey(eIdx, s);
          const w = localStorage.getItem(wKey) || currentVariant.defaultWeight;
          const r = localStorage.getItem(rKey) || ex.targetMin;
          setsData.push({ weight: w, reps: r, unit: currentVariant.isLevel ? "taso" : "kg" });
        }
        entry.exercises.push({ name: `${ex.name} (${currentVariant.name})`, sets: setsData });
      });

      let history = JSON.parse(localStorage.getItem("workout_history") || "[]");
      history.unshift(entry);
      localStorage.setItem("workout_history", JSON.stringify(history));
    }

    function renderHistory(container) {
      let history = JSON.parse(localStorage.getItem("workout_history") || "[]");

      let html = `
        <div style="font-size:1.1rem; font-weight:700; margin-bottom:12px; color:var(--accent);">
          📜 Treenihistoria & Kehitys
        </div>

        <div class="history-entry" style="border-color:#3730a3; background:#11162b;">
          <div class="history-header" style="color:#a5b4fc;">
            <span>Lähtötaso (Juho - Gym08)</span>
            <span style="font-size:0.75rem; color:var(--text-dim);">Alkuarvot</span>
          </div>
          <div class="history-item"><span>Penkkipunnerrus</span> <b>52.5 kg (3 × 6)</b></div>
          <div class="history-item"><span>Vinopenkki KP</span> <b>16 kg (2 × 6) + 14 kg (1 × 8)</b></div>
          <div class="history-item"><span>Takakyykky</span> <b>50 kg (3 × 8)</b></div>
          <div class="history-item"><span>Maastaveto (Mave)</span> <b>100 kg (3 × 6)</b></div>
          <div class="history-item"><span>Reidenkoukistus</span> <b>Taso 6 (3 × 12)</b></div>
        </div>
      `;

      if (history.length === 0) {
        html += `<p style="color:var(--text-dim); text-align:center; margin-top:20px;">Ei vielä tallennettuja treenejä. Kun saat treenin valmiiksi, tiedot tallentuvat tähän.</p>`;
      } else {
        history.forEach(h => {
          html += `
            <div class="history-entry">
              <div class="history-header">
                <span>${h.name}</span>
                <span style="font-size:0.75rem; color:var(--text-dim);">${h.date}</span>
              </div>
          `;
          h.exercises.forEach(ex => {
            const completedSets = ex.sets.map(s => `${s.weight}${s.unit} × ${s.reps}`).join(", ");
            html += `
              <div class="history-item">
                <span>${ex.name}</span>
                <span style="font-weight:600; color:var(--accent);">${completedSets}</span>
              </div>
            `;
          });
          html += `</div>`;
        });
      }

      container.innerHTML = html;
    }

    function resetCurrentWorkout() {
      if (confirm("Nollataanko tämän päivän suoritetut sarjat? Painot ja toistomäärät säilyvät muistissa.")) {
        const workout = programData[currentMode][currentTab];
        workout.exercises.forEach((ex, eIdx) => {
          localStorage.setItem(getProgStepKey(eIdx), "0");
        });
        renderContent();
      }
    }

    // Init
    setProgramMode(currentMode);
  </script>
</body>
</html>
