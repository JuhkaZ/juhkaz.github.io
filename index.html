<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vitun iso mörkö">
  <title>Vitun iso mörkö</title>
  <style>
    :root {
      --bg: #070a12;
      --card-bg: #121a2d;
      --accent: #38bdf8;
      --accent-purple: #c084fc;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --done: #22c55e;
      --border: #1e2c47;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 12px 12px 100px 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      text-align: center;
      padding: 8px 0 14px 0;
    }
    .main-title {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(192,132,252,0.15));
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform 0.1s ease;
    }
    .main-title:active {
      transform: scale(0.96);
    }
    
    /* Mode selector */
    .mode-container {
      display: flex;
      background: #060911;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1;
      min-width: 62px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 9px 4px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #070a12;
      border-color: var(--accent);
    }
    .tab-btn.history-tab {
      background: #1e1b4b;
      color: #c7d2fe;
      border-color: #3730a3;
    }
    .tab-btn.history-tab.active {
      background: #818cf8;
      color: #070a12;
    }

    /* Exercise cards */
    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .exercise-title {
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f8fafc;
    }
    .exercise-title span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-tag {
      font-size: 0.75rem;
      color: var(--accent);
      opacity: 0.85;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .exercise-target {
      font-size: 0.76rem;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .set-row {
      display: grid;
      grid-template-columns: 26px 1fr 1fr 42px;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .set-label { color: var(--text-dim); font-size: 0.8rem; font-weight: 700; }
    .stepper {
      display: flex;
      align-items: center;
      background: #070a12;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .step-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 1.15rem;
      font-weight: bold;
      width: 32px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-value {
      flex: 1;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }
    .btn-done {
      background: var(--border);
      border: none;
      color: var(--text-dim);
      height: 34px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-done.completed { background: var(--done); color: #070a12; }

    /* Action buttons */
    .footer-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }
    .btn-save-workout {
      background: var(--done);
      border: none;
      color: #070a12;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #121a2d;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent);
      margin: 0;
    }
    .modal-close {
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .motion-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .motion-box {
      background: #070a12;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .motion-tag {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }
    .motion-tag.start { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .motion-tag.end { background: rgba(34, 197, 94, 0.2); color: var(--done); }
    .motion-desc {
      font-size: 0.78rem;
      color: var(--text);
      line-height: 1.35;
      font-weight: 600;
    }
    .modal-target {
      font-size: 0.82rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 8px;
    }
    .modal-tips {
      margin: 0 0 14px 0;
      padding-left: 18px;
      font-size: 0.8rem;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .modal-tips li { margin-bottom: 4px; }
    .btn-quick-video {
      display: block;
      width: 100%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
    }

    /* Mörkö Modal with Official Image */
    .morko-card {
      background: #0d0b1a;
      border: 2px solid var(--accent-purple);
      text-align: center;
      padding: 20px 16px;
    }
    .morko-img-container {
      position: relative;
      display: inline-block;
      margin-bottom: 12px;
    }
    .morko-real-img {
      width: 100%;
      max-width: 270px;
      height: auto;
      border-radius: 12px;
      border: 2px solid var(--accent-purple);
      box-shadow: 0 0 25px rgba(192, 132, 252, 0.45);
      display: block;
    }
    .morko-quote {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--accent-purple);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 6px;
    }
    .morko-sub {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    /* History View */
    .history-entry {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
    }
    .history-item {
      font-size: 0.82rem;
      padding: 3px 0;
      display: flex;
      justify-content: space-between;
      color: var(--text);
    }
    .history-date { color: var(--text-dim); font-size: 0.75rem; }

    /* Timer bar */
    .timer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0284c7;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 0.95rem;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.5);
      transform: translateY(100%);
      transition: transform 0.25s ease;
      z-index: 100;
    }
    .timer-bar.show { transform: translateY(0); }
    .timer-btn {
      background: rgba(0,0,0,0.25);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="main-title" onclick="openMorkoModal()">VITUN ISO MÖRKÖ</div>
  </header>

  <div class="mode-container">
    <button id="mode-5" class="mode-btn active" onclick="setProgramMode('5day')">5 pv / vko (PPL-UL)</button>
    <button id="mode-3" class="mode-btn" onclick="setProgramMode('3day')">3 pv / vko (Koko keho)</button>
  </div>

  <div id="tabs-container" class="tabs"></div>

  <div id="main-content"></div>

  <!-- Movement Guide Modal (2-Step Visual Trajectory) -->
  <div id="guide-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Liikkeen nimi</h3>
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
      </div>

      <div class="motion-grid">
        <div class="motion-box">
          <span class="motion-tag start">1. Lähtö / Venytys</span>
          <div id="modal-step1" class="motion-desc"></div>
        </div>
        <div class="motion-box">
          <span class="motion-tag end">2. Loppu / Supistus</span>
          <div id="modal-step2" class="motion-desc"></div>
        </div>
      </div>

      <div id="modal-target" class="modal-target"></div>
      <ul id="modal-tips" class="modal-tips"></ul>
      <a id="modal-video-btn" class="btn-quick-video" href="#" target="_blank" rel="noopener">▶️ Katso 15s tekniikkavideo YouTubesta</a>
    </div>
  </div>

  <!-- Authentic Mörkö Modal -->
  <div id="morko-modal" class="modal-overlay" onclick="closeMorkoModal(event)">
    <div class="modal-card morko-card" onclick="event.stopPropagation()">
      <div class="morko-img-container">
        <img 
          src="morko.png" 
          onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/fi/thumb/b/be/Morko_muumilaaksosta.png/400px-Morko_muumilaaksosta.png'" 
          alt="Mörkö" 
          class="morko-real-img"
        />
      </div>
      <div class="morko-quote">VITUN ISO MÖRKÖ</div>
      <div class="morko-sub">"Gym08:n kylmintä rautaa ja kuuminta pumppia."</div>
      <button class="btn-save-workout" onclick="closeMorkoModalDirect()">Sulje & Jatka treeniä</button>
    </div>
  </div>

  <div id="timer" class="timer-bar">
    <span id="timer-text">Lepo: 2:00</span>
    <div>
      <button class="timer-btn" onclick="addTimer(30)">+30s</button>
      <button class="timer-btn" onclick="stopTimer()">Sulje</button>
    </div>
  </div>

  <script>

    function changeVal(eIdx, sIdx, type, delta) {
      const ex = programData[currentMode][currentTab].exercises[eIdx];

      val = Math.round(val * 10) / 10;

      localStorage.setItem(key, val);
      const unit = type === 'w' ? (ex.isLevel ? "taso" : "kg") : "t";
      document.getElementById(`val_${type}_${eIdx}_${sIdx}`).innerText = `${val} ${unit}`;

      const newStatus = !isDone;

      localStorage.setItem(key, newStatus);

        btn.innerText = "✓";

    // --- SOUND & VIBRATION & NOTIFICATION TIMER ---
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.8);
      } catch (e) {}
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      targetTimerEnd = Date.now() + seconds * 1000;
      document.getElementById("timer").classList.add("show");
      updateTimerUI();

      timerInterval = setInterval(() => {
        const remaining = Math.round((targetTimerEnd - Date.now()) / 1000);
        if (remaining <= 0) {
          clearInterval(timerInterval);
          onTimerFinished();
        } else {
          updateTimerUI();
        }
      }, 500);
    }

    function updateTimerUI() {
      const remaining = Math.max(0, Math.round((targetTimerEnd - Date.now()) / 1000));
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      document.getElementById("timer-text").innerText = `Lepo: ${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function onTimerFinished() {
      document.getElementById("timer-text").innerText = "Lepo päättyi! Seuraava sarja!";

      if ("vibrate" in navigator) {
        navigator.vibrate([400, 150, 400, 150, 600]);
      }

      playBeep();

      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("Palautusaika päättyi! ⏱️", {
          body: "Aika aloittaa seuraava sarja.",
          icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>"
        });
      }
    }

    function addTimer(sec) {
      if (targetTimerEnd) {
        targetTimerEnd += sec * 1000;
        updateTimerUI();
      }
    }

    function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById("timer").classList.remove("show");
    }

    // --- HISTORY SYSTEM ---
    function saveCurrentToHistory() {
      const workout = programData[currentMode][currentTab];
      const dateStr = new Date().toLocaleDateString("fi-FI", { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

      const entry = {
        date: dateStr,
        name: workout.name,
        exercises: []
      };

      workout.exercises.forEach((ex, eIdx) => {
        const setsData = [];
        for (let s = 0; s < ex.sets; s++) {
          const w = localStorage.getItem(getKey(currentMode, currentTab, eIdx, s, "w")) || ex.defaultWeight;
          const r = localStorage.getItem(getKey(currentMode, currentTab, eIdx, s, "r")) || ex.defaultReps;
          const d = localStorage.getItem(getKey(currentMode, currentTab, eIdx, s, "done")) === "true";
          setsData.push({ weight: w, reps: r, done: d, unit: ex.isLevel ? "taso" : "kg" });
        }
        entry.exercises.push({ name: ex.name, sets: setsData });
      });

      let history = JSON.parse(localStorage.getItem("workout_history") || "[]");
      history.unshift(entry);
      localStorage.setItem("workout_history", JSON.stringify(history));

      alert("Treeni tallennettu onnistuneesti historiaan!");

          </div>
          <div class="history-item"><span>Penkkipunnerrus</span> <b>52.5 kg (3 × 6)</b></div>
          <div class="history-item"><span>Vinopenkki KP</span> <b>16 kg (2 × 6) + 14 kg (1 × 8)</b></div>
          <div class="history-item"><span>Takakyykky</span> <b>50 kg (3 × 8)</b></div>
          <div class="history-item"><span>Maastaveto (Mave)</span> <b>100 kg (3 × 6)</b></div>
          <div class="history-item"><span>Reidenkoukistus</span> <b>Taso 6 (3 × 12)</b></div>
        </div>
      `;

      if (history.length === 0) {
        html += `<p style="color:var(--text-dim); text-align:center; margin-top:20px;">Ei vielä tallennettuja treenejä. Kun teet treenin ja painat "Tallenna treeni historiaan", merkinnät näkyvät tässä.</p>`;
      } else {
        history.forEach((h, idx) => {
          html += `
            <div class="history-entry">
              <div class="history-header">
                <span>${h.name}</span>
                <span class="history-date">${h.date}</span>
              </div>
          `;
          h.exercises.forEach(ex => {
            const completedSets = ex.sets.map(s => `${s.weight}${s.unit} × ${s.reps}`).join(", ");
            html += `
              <div class="history-item">
                <span>${ex.name}</span>
                <span style="font-weight:600; color:var(--accent);">${completedSets}</span>
              </div>
            `;
          });
          html += `</div>`;
        });
      }

      container.innerHTML = html;
    }

    function resetCurrentWorkout() {
      if (confirm("Nollataanko tämän päivän suoritetut rastit? Painot ja toistot säilyvät.")) {
        const workout = programData[currentMode][currentTab];
        workout.exercises.forEach((ex, eIdx) => {
          for (let s = 0; s < ex.sets; s++) {
            localStorage.setItem(getKey(currentMode, currentTab, eIdx, s, "done"), "false");
          }
        });
        renderContent();
      }
    }

    // Init
    setProgramMode(currentMode);
  </script>
</body>
</html>
