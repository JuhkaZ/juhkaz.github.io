<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vitun iso mörkö">
  <title>Vitun iso mörkö</title>
  <style>
    :root {
      --bg: #070a12;
      --card-bg: #121a2d;
      --accent: #38bdf8;
      --accent-purple: #c084fc;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --done: #22c55e;
      --border: #1e2c47;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 12px 12px 110px 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header { text-align: center; padding: 6px 0 14px 0; }
    .main-title {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(192,132,252,0.15));
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform 0.1s ease;
    }
    .main-title:active { transform: scale(0.96); }

    .mode-container {
      display: flex;
      background: #060911;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1;
      min-width: 62px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 9px 4px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #070a12;
      border-color: var(--accent);
    }
    .tab-btn.history-tab {
      background: #1e1b4b;
      color: #c7d2fe;
      border-color: #3730a3;
    }
    .tab-btn.history-tab.active {
      background: #818cf8;
      color: #070a12;
    }

    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .exercise-title {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-edit-gear {
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
    }
    .info-tag {
      font-size: 0.72rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 6px;
    }

    .variant-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .variant-btn {
      background: #070a12;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }
    .variant-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }

    .target-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      margin-bottom: 10px;
      padding: 5px 8px;
      background: #070a12;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .target-text { color: var(--accent); font-weight: 600; }
    .overload-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .overload-ready { background: rgba(34, 197, 94, 0.2); color: var(--done); border: 1px solid var(--done); }
    .overload-wait { color: var(--text-dim); }

    .set-row {
      display: grid;
      grid-template-columns: 28px 1fr 1fr;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .set-label { color: var(--text-dim); font-size: 0.8rem; font-weight: 700; }
    .stepper {
      display: flex;
      align-items: center;
      background: #070a12;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .step-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 1.15rem;
      font-weight: bold;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-value {
      flex: 1;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }

    .set-action-btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border-radius: 8px;
      border: none;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #1e293b;
      color: var(--accent);
      border: 1px solid var(--accent);
      transition: background 0.15s ease;
    }
    .set-action-btn.active-step { background: var(--accent); color: #070a12; }
    .set-action-btn.finished-step { background: var(--done); color: #070a12; border-color: var(--done); }

    .flash-alert {
      position: fixed;
      inset: 0;
      background: rgba(56, 189, 248, 0.95);
      color: #070a12;
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .flash-alert.active {
      opacity: 1;
      pointer-events: auto;
      animation: pulseScreen 1s infinite alternate;
    }
    @keyframes pulseScreen {
      from { background: rgba(56, 189, 248, 0.95); }
      to { background: rgba(34, 197, 94, 0.95); }
    }
    .flash-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; }
    .flash-sub { font-size: 1.1rem; font-weight: 700; margin-bottom: 24px; }
    .btn-dismiss-flash {
      background: #070a12;
      color: #fff;
      border: none;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 14px 28px;
      border-radius: 12px;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: #121a2d;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-title { font-size: 1.1rem; font-weight: 800; color: var(--accent); margin: 0; }
    .modal-close {
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    /* Form inside Edit Modal */
    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: #070a12;
      border: 1px solid var(--border);
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .radio-group {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .radio-label {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #070a12;
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .radio-label input { cursor: pointer; }

    .motion-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .motion-box { background: #070a12; border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
    .motion-tag { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
    .motion-tag.start { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .motion-tag.end { background: rgba(34, 197, 94, 0.2); color: var(--done); }
    .motion-desc { font-size: 0.78rem; color: var(--text); line-height: 1.35; font-weight: 600; }
    .modal-target { font-size: 0.82rem; font-weight: 700; color: #e2e8f0; margin-bottom: 8px; }
    .modal-tips { margin: 0 0 14px 0; padding-left: 18px; font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; }
    .btn-quick-video {
      display: block;
      width: 100%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
    }

    /* Mörkö Easter Egg Modal */
    .morko-card {
      background: #0d0b1a;
      border: 2px solid var(--accent-purple);
      text-align: center;
      padding: 20px 16px;
    }
    .morko-scene-container {
      width: 100%;
      max-width: 290px;
      border-radius: 12px;
      border: 2px solid var(--accent-purple);
      margin: 0 auto 12px auto;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(192, 132, 252, 0.35);
      background: #a4c4e8;
    }
    .morko-svg-scene {
      display: block;
      width: 100%;
      height: auto;
    }
    .raw-code {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 4px;
      margin: 10px 0 16px 0;
      font-family: monospace;
    }

    .footer-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
    .btn-save-workout { background: var(--done); border: none; color: #070a12; font-weight: 700; padding: 12px; border-radius: 10px; font-size: 0.9rem; cursor: pointer; }
    .btn-reset { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 8px 16px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; }

    .timer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0284c7;
      color: #fff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 0.95rem;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      z-index: 100;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.5);
    }
    .timer-bar.show { transform: translateY(0); }
    .timer-controls { display: flex; align-items: center; gap: 4px; }
    .timer-btn { background: rgba(0,0,0,0.25); border: none; color: #fff; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 700; }
    .timer-btn.close { background: rgba(0,0,0,0.5); }

    /* Structured History Layout */
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .history-header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .history-badge {
      background: rgba(56,189,248,0.15);
      color: var(--accent);
      font-weight: 800;
      font-size: 0.82rem;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .history-time { font-size: 0.75rem; color: var(--text-dim); }
    .history-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.82rem;
    }
    .history-item-name { font-weight: 600; color: #f1f5f9; }
    .history-sets-pills { display: flex; gap: 4px; flex-wrap: wrap; }
    .history-pill {
      background: #070a12;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="main-title" onclick="openMorkoModal()">VITUN ISO MÖRKÖ</div>
  </header>

  <div class="mode-container">
    <button id="mode-5" class="mode-btn active" onclick="setProgramMode('5day')">5 pv / vko (PPL-UL)</button>
    <button id="mode-3" class="mode-btn" onclick="setProgramMode('3day')">3 pv / vko (Koko keho)</button>
  </div>

  <div id="tabs-container" class="tabs"></div>

  <div id="main-content"></div>

  <!-- Screen Flash Alert -->
  <div id="flash-alert" class="flash-alert">
    <div id="flash-title" class="flash-title">⏱️ TAUON AIKA TÄYNNÄ!</div>
    <div id="flash-sub" class="flash-sub">Kylmä rauta kutsuu. Seuraava sarja käyntiin!</div>
    <button class="btn-dismiss-flash" onclick="dismissFlash()">Kuittaa & Aloita</button>
  </div>

  <!-- Dynamic Movement Guide Modal -->
  <div id="guide-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Liikkeen nimi</h3>
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
      </div>
      <div class="motion-grid">
        <div class="motion-box">
          <span class="motion-tag start">1. Lähtö / Venytys</span>
          <div id="modal-step1" class="motion-desc"></div>
        </div>
        <div class="motion-box">
          <span class="motion-tag end">2. Loppu / Supistus</span>
          <div id="modal-step2" class="motion-desc"></div>
        </div>
      </div>
      <div id="modal-target" class="modal-target"></div>
      <ul id="modal-tips" class="modal-tips"></ul>
      <a id="modal-video-btn" class="btn-quick-video" href="#" target="_blank" rel="noopener">▶️ Katso 15s tekniikkavideo YouTubesta</a>
    </div>
  </div>

  <!-- Equipment / Exercise Customization Modal -->
  <div id="edit-modal" class="modal-overlay" onclick="closeEditModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">⚙️ Muokkaa laitteen asetuksia</h3>
        <button class="modal-close" onclick="closeEditModalDirect()">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">Laitteen / suoritusmuodon nimi</label>
        <input type="text" id="edit-name-input" class="form-input" />
      </div>
      <div class="form-group">
        <label class="form-label">Mittaustapa</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="edit-unit" id="unit-kg" value="kg" />
            Painot (kg)
          </label>
          <label class="radio-label">
            <input type="radio" name="edit-unit" id="unit-level" value="level" />
            Asetukset (taso)
          </label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Askelkoko (+/- nappeihin)</label>
        <input type="number" id="edit-step-input" class="form-input" step="0.5" min="0.5" />
      </div>
      <div style="display: flex; gap: 8px; margin-top: 18px;">
        <button class="btn-save-workout" style="flex: 2;" onclick="saveCustomEquipment()">Tallenna muutokset</button>
        <button class="btn-reset" style="flex: 1;" onclick="resetCustomEquipment()">Palauta oletus</button>
      </div>
    </div>
  </div>

  <!-- Mörkö Easter Egg Modal -->
  <div id="morko-modal" class="modal-overlay" onclick="closeMorkoModal(event)">
    <div class="modal-card morko-card" onclick="event.stopPropagation()">
      <div class="morko-scene-container">
        <svg class="morko-svg-scene" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="winterSky" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#8bb1db"/>

              <stop offset="100%" stop-color="#eaf2f9"/>
            </linearGradient>
            <linearGradient id="snowGround" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#eaf2fa"/>

            <rect x="171" y="120" width="5" height="8" rx="0.8" />
            <rect x="178" y="120" width="5" height="8" rx="0.8" />
            <rect x="185" y="120" width="5" height="8" rx="0.8" />
            <rect x="192" y="120" width="5" height="8" rx="0.8" />
            <rect x="199" y="120" width="5" height="8" rx="0.8" />
            <rect x="206" y="120" width="5" height="8" rx="0.8" />
            <rect x="213" y="120" width="5" height="8" rx="0.8" />
            <rect x="220" y="120" width="5" height="8" rx="0.8" />
          </g>

                <button class="step-btn" onclick="changeVal(${eIdx}, '${currentVariant.id}', ${s}, 'r', -1)">-</button>
                <span class="step-value" id="val_r_${eIdx}_${s}">${savedR} toistoa</span>
                <button class="step-btn" onclick="changeVal(${eIdx}, '${currentVariant.id}', ${s}, 'r', 1)">+</button>
              </div>
            </div>
          `;
        }

        const isLastExercise = (eIdx === totalExercises - 1);
        let buttonText = "Kuittaa sarja 1/3 ▶ (Aloita tauko)";
        let buttonClass = "";

        if (stepStatus === 1) {
          buttonText = "Kuittaa sarja 2/3 ▶ (Aloita tauko)";
          buttonClass = "active-step";
        } else if (stepStatus === 2) {
          buttonText = isLastExercise ? "Kuittaa sarja 3/3 ▶ (15s lopputauko 🏁)" : "Kuittaa sarja 3/3 ✓ (Valmis!)";
          buttonClass = "active-step";
        } else if (stepStatus >= 3) {
          buttonText = isLastExercise ? "Treeni valmis & tallennettu 🏆 (Nollaa)" : "Liike suoritettu (3/3) ✓ (Nollaa)";
          buttonClass = "finished-step";
        }

        html += `
          <button class="set-action-btn ${buttonClass}" onclick="handleSetProgress(${eIdx}, ${ex.rest}, ${isLastExercise})">
            ${buttonText}
          </button>
        </div>`;
      });

      html += `
        <div class="footer-actions">
          <button class="btn-save-workout" onclick="saveCurrentToHistory()">💾 Tallenna treeni historiaan</button>
          <button class="btn-reset" onclick="resetCurrentWorkout()">Nollaa tämän päivän sarjamerkinnät</button>
        </div>
      `;

      main.innerHTML = html;
    }

    function changeVal(eIdx, vId, sIdx, type, delta) {
      const ex = programData[currentMode][currentTab].exercises[eIdx];
      const selectedVIdx = parseInt(getSelectedVariant(eIdx)) || 0;
      const currentVariant = getVariantData(ex, eIdx, selectedVIdx);
      const key = type === 'w' ? getWeightKey(eIdx, vId, sIdx) : getRepsKey(eIdx, sIdx);
      let val = localStorage.getItem(key) !== null ? parseFloat(localStorage.getItem(key)) : (type === 'w' ? currentVariant.defaultWeight : ex.targetMin);

      val = Math.max(0, val + delta);
      val = Math.round(val * 10) / 10;
      localStorage.setItem(key, val);

      renderContent();
    }

    function handleSetProgress(eIdx, restSeconds, isLastExercise) {
      initNotifications();
      const stepKey = getProgStepKey(eIdx);
      let currentStep = parseInt(localStorage.getItem(stepKey) || "0");

      if (currentStep === 0) {
        localStorage.setItem(stepKey, "1");
        startTimer(restSeconds);
      } else if (currentStep === 1) {
        localStorage.setItem(stepKey, "2");
        startTimer(restSeconds);
      } else if (currentStep === 2) {
        localStorage.setItem(stepKey, "3");
        if (isLastExercise) {
          // 15 seconds finish break on final set of workout
          startTimer(15, true);
        } else {
          stopTimer();
        }
      } else {
        localStorage.setItem(stepKey, "0");
      }

      renderContent();
    }

    // --- MODAL: EDIT EQUIPMENT & SETTINGS ---
    function openEditModal(eIdx, vIdx) {
      editContext = { eIdx, vIdx };
      const ex = programData[currentMode][currentTab].exercises[eIdx];
      const currentVariant = getVariantData(ex, eIdx, vIdx);

      document.getElementById("edit-name-input").value = currentVariant.name;
      document.getElementById("unit-kg").checked = !currentVariant.isLevel;
      document.getElementById("unit-level").checked = currentVariant.isLevel;
      document.getElementById("edit-step-input").value = currentVariant.step;

      document.getElementById("edit-modal").classList.add("open");
    }

    function closeEditModalDirect() {
      document.getElementById("edit-modal").classList.remove("open");
    }
    function closeEditModal(e) {
      if (e.target.id === "edit-modal") closeEditModalDirect();
    }

    function saveCustomEquipment() {
      const name = document.getElementById("edit-name-input").value.trim();
      const isLevel = document.getElementById("unit-level").checked;
      const step = parseFloat(document.getElementById("edit-step-input").value) || 1;

      const key = getCustomVariantKey(editContext.eIdx, editContext.vIdx);
      localStorage.setItem(key, JSON.stringify({ name, isLevel, step }));

      closeEditModalDirect();
      renderContent();
    }

    function resetCustomEquipment() {
      const key = getCustomVariantKey(editContext.eIdx, editContext.vIdx);
      localStorage.removeItem(key);

      closeEditModalDirect();
      renderContent();
    }

    // --- SILENT SCREEN FLASH & NOTIFICATION ---
    function triggerSilentAlarm(isFinish = false) {
      if ("vibrate" in navigator) {
        navigator.vibrate(isFinish ? [800, 200, 800, 200, 1200] : [600, 200, 600, 200, 1000]);
      }
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(isFinish ? 1046 : 880, ctx.currentTime);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.0);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 1.0);
      } catch (e) {}

      const flash = document.getElementById("flash-alert");
      document.getElementById("flash-title").innerText = isFinish ? "🏆 TREENI SUORITETTU!" : "⏱️ TAUON AIKA TÄYNNÄ!";
      document.getElementById("flash-sub").innerText = isFinish ? "Treeni kuittautui tehdyksi ja tallennettiin historiaan." : "Kylmä rauta kutsuu. Seuraava sarja käyntiin!";
      flash.classList.add("active");

      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(isFinish ? "Treeni suoritettu! 🏆" : "Palautusaika päättyi! ⏱️", {
          body: isFinish ? "Treeni on kuittautunut ja tallennettu historiaan." : "Aika aloittaa seuraava sarja!",
          requireInteraction: true
        });
      }
    }

    function dismissFlash() {
      document.getElementById("flash-alert").classList.remove("active");
    }

    function startTimer(seconds, isFinalWorkoutBreak = false) {
      clearInterval(timerInterval);
      targetTimerEnd = Date.now() + seconds * 1000;
      localStorage.setItem("saved_timer_target", targetTimerEnd);
      localStorage.setItem("is_final_timer", isFinalWorkoutBreak ? "true" : "false");
      document.getElementById("timer").classList.add("show");
      updateTimerUI(isFinalWorkoutBreak);

      timerInterval = setInterval(() => {
        const remaining = Math.round((targetTimerEnd - Date.now()) / 1000);
        if (remaining <= 0) {
          clearInterval(timerInterval);
          localStorage.removeItem("saved_timer_target");
          localStorage.removeItem("is_final_timer");
          document.getElementById("timer-text").innerText = isFinalWorkoutBreak ? "Treeni valmis! 🏆" : "Aika täynnä!";
          
          if (isFinalWorkoutBreak) {
            saveCurrentToHistory();
            renderContent();
            triggerSilentAlarm(true);
          } else {
            triggerSilentAlarm(false);
          }
        } else {
          updateTimerUI(isFinalWorkoutBreak);
        }
      }, 500);
    }

    function checkActiveTimerOnLoad() {
      const savedEnd = localStorage.getItem("saved_timer_target");
      const isFinal = localStorage.getItem("is_final_timer") === "true";
      if (savedEnd) {
        const remaining = Math.round((parseInt(savedEnd) - Date.now()) / 1000);
        if (remaining > 0) {
          startTimer(remaining, isFinal);
        } else {
          localStorage.removeItem("saved_timer_target");
          localStorage.removeItem("is_final_timer");
        }
      }
    }

    function updateTimerUI(isFinal = false) {
      const remaining = Math.max(0, Math.round((targetTimerEnd - Date.now()) / 1000));
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      const prefix = isFinal ? "Viimeistelytauko: " : "Lepo: ";
      document.getElementById("timer-text").innerText = `${prefix}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function addTimer(sec) {
      if (targetTimerEnd) {
        targetTimerEnd += sec * 1000;
        localStorage.setItem("saved_timer_target", targetTimerEnd);
        updateTimerUI(localStorage.getItem("is_final_timer") === "true");
      }
    }

    function stopTimer() {
      clearInterval(timerInterval);
      localStorage.removeItem("saved_timer_target");
      localStorage.removeItem("is_final_timer");
      document.getElementById("timer").classList.remove("show");
    }

    function openExerciseGuide(eIdx) {
      const ex = programData[currentMode][currentTab].exercises[eIdx];
      const selectedVIdx = parseInt(getSelectedVariant(eIdx)) || 0;
      const variant = getVariantData(ex, eIdx, selectedVIdx);
      const guide = variant.guide || {
        title: ex.name,
        step1: "Ota tukeva alkuasento ja hallitse liikerata.",
        step2: "Tee voimakas supistus ja jarruta alasvienti.",
        target: "Voima & Hypertrofia",
        tips: ["Tee sarjat puhtaalla tekniikalla."],
        query: ex.name + " form short"
      };

      document.getElementById("modal-title").innerText = guide.title;
      document.getElementById("modal-step1").innerText = guide.step1;
      document.getElementById("modal-step2").innerText = guide.step2;
      document.getElementById("modal-target").innerText = `Kohde: ${guide.target}`;
      document.getElementById("modal-tips").innerHTML = guide.tips.map(t => `<li>${t}</li>`).join("");
      document.getElementById("modal-video-btn").href = `https://www.youtube.com/results?search_query=${encodeURIComponent(guide.query)}`;

      document.getElementById("guide-modal").classList.add("open");
    }

    function closeModalDirect() { document.getElementById("guide-modal").classList.remove("open"); }
    function closeModal(e) { if (e.target.id === "guide-modal") closeModalDirect(); }

    function openMorkoModal() { document.getElementById("morko-modal").classList.add("open"); }
    function closeMorkoModalDirect() { document.getElementById("morko-modal").classList.remove("open"); }
    function closeMorkoModal(e) { if (e.target.id === "morko-modal") closeMorkoModalDirect(); }

    function saveCurrentToHistory() {
      const workout = programData[currentMode][currentTab];
      const dateStr = new Date().toLocaleDateString("fi-FI", { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

      const entry = {
        date: dateStr,
        name: workout.name,
        exercises: []
      };

      workout.exercises.forEach((ex, eIdx) => {
        const selectedVIdx = parseInt(getSelectedVariant(eIdx)) || 0;
        const currentVariant = getVariantData(ex, eIdx, selectedVIdx);
        const setsData = [];

        for (let s = 0; s < 3; s++) {
          const wKey = getWeightKey(eIdx, currentVariant.id, s);
          const rKey = getRepsKey(eIdx, s);
          const w = localStorage.getItem(wKey) || currentVariant.defaultWeight;
          const r = localStorage.getItem(rKey) || ex.targetMin;
          setsData.push({ weight: w, reps: r, unit: currentVariant.isLevel ? "taso" : "kg" });
        }
        entry.exercises.push({ name: `${ex.name} (${currentVariant.name})`, sets: setsData });
      });

      let history = JSON.parse(localStorage.getItem("workout_history") || "[]");
      history.unshift(entry);
      localStorage.setItem("workout_history", JSON.stringify(history));
    }

    function renderHistory(container) {
      let history = JSON.parse(localStorage.getItem("workout_history") || "[]");

      let html = `
        <div style="font-size:1.15rem; font-weight:800; margin-bottom:14px; color:var(--accent);">
          📜 Tallennetut Treenit
        </div>

        <div class="history-card" style="border-color:#3730a3; background:#101328;">
          <div class="history-header-box">
            <span class="history-badge" style="background:#272758; color:#c7d2fe;">Lähtötaso (Juho)</span>
            <span class="history-time">Alkuarvot</span>
          </div>
          <div class="history-item-row">
            <span class="history-item-name">Penkkipunnerrus</span>
            <div class="history-sets-pills"><span class="history-pill">52.5 kg × 6</span></div>
          </div>
          <div class="history-item-row">
            <span class="history-item-name">Vinopenkki KP</span>
            <div class="history-sets-pills"><span class="history-pill">16 kg × 6</span><span class="history-pill">14 kg × 8</span></div>
          </div>
          <div class="history-item-row">
            <span class="history-item-name">Takakyykky</span>
            <div class="history-sets-pills"><span class="history-pill">50 kg × 8</span></div>
          </div>
          <div class="history-item-row">
            <span class="history-item-name">Maastaveto</span>
            <div class="history-sets-pills"><span class="history-pill">100 kg × 6</span></div>
          </div>
          <div class="history-item-row" style="border:none;">
            <span class="history-item-name">Reidenkoukistus</span>
            <div class="history-sets-pills"><span class="history-pill">Taso 6 × 12</span></div>
          </div>
        </div>
      `;

      if (history.length === 0) {
        html += `<p style="color:var(--text-dim); text-align:center; margin-top:24px;">Ei vielä tallennettuja treenejä. Kun saat treenin valmiiksi, tiedot tallentuvat tähän selkeinä kortteina.</p>`;
      } else {
        history.forEach(h => {
          html += `
            <div class="history-card">
              <div class="history-header-box">
                <span class="history-badge">${h.name}</span>
                <span class="history-time">${h.date}</span>
              </div>
          `;
          h.exercises.forEach((ex, idx) => {
            const isLast = (idx === h.exercises.length - 1);
            html += `
              <div class="history-item-row" ${isLast ? 'style="border:none;"' : ''}>
                <span class="history-item-name">${ex.name}</span>
                <div class="history-sets-pills">
                  ${ex.sets.map(s => `<span class="history-pill">${s.weight} ${s.unit} × ${s.reps}</span>`).join("")}
                </div>
              </div>
            `;
          });
          html += `</div>`;
        });
      }

      container.innerHTML = html;
    }

    function resetCurrentWorkout() {
      if (confirm("Nollataanko tämän päivän suoritetut sarjat? Painot ja toistomäärät säilyvät muistissa.")) {
        const workout = programData[currentMode][currentTab];
        workout.exercises.forEach((ex, eIdx) => {
          localStorage.setItem(getProgStepKey(eIdx), "0");
        });
        renderContent();
      }
    }

    setProgramMode(currentMode);
    checkActiveTimerOnLoad();
  </script>
</body>
</html>
